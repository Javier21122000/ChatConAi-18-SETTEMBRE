#openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
#openrouter.timeout-seconds=${OPENROUTER_TIMEOUT_SECONDS:30}
#openrouter.retry-after-max-seconds=${OPENROUTER_RETRY_AFTER_MAX_SECONDS:8}
# OpenAI - implementazione attiva (API dirette).
openai.api.key=${OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
# Security JWT
# JWT_SECRET: chiave casuale codificata Base64, almeno 32 byte prima della codifica.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:chatconai}
# Origini frontend esatte, separate da virgola (es. http://localhost:5173).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.error.include-message=never
server.error.include-stacktrace=never
